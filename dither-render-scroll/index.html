<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Render Scroll — Volumetric Studies</title>
<div class="render-scroll-track" aria-hidden="true"></div>
<main class="study-page dither-render-page scroll-render-page">
  <canvas class="webgl" aria-label="Scroll-controlled ARGUS model resolving from glyph dither into shaded 3D"></canvas>

  <nav class="study-nav" aria-label="Study navigation">
    <a href="/dither-render/">← 14</a><a href="/">Study 15 / Scroll Render</a><a class="next" href="/dither-render-organic/">16 →</a>
  </nav>
  <div class="study-status eyebrow">SCROLL ↓ / DITHER SHADER → 3D RENDER</div>

  <div id="render-loading" class="render-loading">
    <span>Building scroll-linked field</span><output>0%</output>
  </div>

  <div class="render-scroll-meter" aria-hidden="true">
    <span>00</span><i></i><span>100</span>
  </div>

  <section class="render-readout" aria-label="Experiment description">
    <p>Experiment 15 / Scroll-linked rendering</p>
    <h1>SCROLL<br>TO FORM</h1>
    <div>SCROLL DOWN — RESOLVE 3D<br>SCROLL UP — RETURN TO DITHER<br>DRAG — ORBIT</div>
  </section>

  <section class="controls render-controls scroll-render-controls" aria-label="Scroll render controls">
    <label class="control"><span class="control-label">Scroll</span><input id="render-progress" type="range" min="0" max="1" value="0" step="0.001"><output class="readout" data-for="render-progress"></output></label>
    <label class="control"><span class="control-label">Glyph size</span><input id="render-cell" type="range" min="7" max="28" value="15" step="1"><output class="readout" data-for="render-cell"></output></label>
    <label class="control"><span class="control-label">Density</span><input id="render-density" type="range" min="0.1" max="1" value="0.94" step="0.01"><output class="readout" data-for="render-density"></output></label>
    <label class="control"><span class="control-label">Spin</span><input id="render-spin" type="range" min="0" max="0.5" value="0.1" step="0.01"><output class="readout" data-for="render-spin"></output></label>
    <button type="button" id="render-restart" class="render-restart">Return to dither / top</button>
  </section>
</main>
<script type="module" src="/src/studies/dither-render.js"></script>
