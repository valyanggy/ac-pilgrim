<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Volume — Volumetric Studies</title>
<main class="study-page dither-page">
  <canvas class="webgl" aria-label="Interactive dithered volumetric signal field"></canvas>
  <nav class="study-nav" aria-label="Study navigation">
    <a href="/point-cloud-focus/">← Previous</a><a href="/">Study 04 / 04</a><a class="next" href="/environment-slice/">Loop →</a>
  </nav>
  <div class="study-status eyebrow">VOLUMETRIC SIGNAL / DITHER FIELD</div>
  <section class="study-copy">
    <p class="study-kicker">Dither / Volume</p>
    <h1>Density without<br>a surface.</h1>
    <p>A probabilistic air volume. The pattern gains coherence where signal concentration and the scanning section intersect.</p>
  </section>
  <section class="controls" aria-label="Study controls">
    <label class="control"><span class="control-label">Section</span><input id="slice" type="range" min="-1" max="1" value="0.05" step="0.01"><output class="readout" data-for="slice"></output></label>
    <label class="control"><span class="control-label">Threshold</span><input id="threshold" type="range" min="0.05" max="0.9" value="0.43" step="0.01"><output class="readout" data-for="threshold"></output></label>
    <label class="control"><span class="control-label">Flow</span><input id="flow" type="range" min="0" max="1.5" value="0.55" step="0.01"><output class="readout" data-for="flow"></output></label>
  </section>
</main>
<script type="module" src="/src/studies/dither-volume.js"></script>
