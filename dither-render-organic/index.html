<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organic Render — Rendering Studies II</title>
<main class="study-page dither-render-page organic-render-page">
  <canvas class="webgl" aria-label="DNA double helix organically propagating from glyph dither into shaded 3D"></canvas>

  <nav class="study-nav" aria-label="Study navigation">
    <a href="/dither-render-scroll/">← 15</a><a href="/rendering-studies/">Rendering Studies II / 01</a><a class="next" href="/dither-render-material/">17 →</a>
  </nav>
  <div class="study-status eyebrow">ORGANIC PROPAGATION / DITHER FIELD → 3D FORM</div>

  <div id="render-loading" class="render-loading">
    <span>Building propagation field</span><output>0%</output>
  </div>

  <section class="render-readout" aria-label="Experiment description">
    <p>Experiment 16 / Organic rendering</p>
    <h1>FORM<br>SPREADS</h1>
    <div>TOP-SEEDED GROWTH<br>OUTLINED CELL FRONTIER<br>DITHER — MATERIAL</div>
  </section>

  <section class="controls render-controls" aria-label="Organic render controls">
    <label class="control"><span class="control-label">Growth</span><input id="render-progress" type="range" min="0" max="1" value="0" step="0.001"><output class="readout" data-for="render-progress"></output></label>
    <label class="control"><span class="control-label">Speed</span><input id="render-speed" type="range" min="0.04" max="0.35" value="0.11" step="0.01"><output class="readout" data-for="render-speed"></output></label>
    <label class="control"><span class="control-label">Glyph size</span><input id="render-cell" type="range" min="7" max="28" value="15" step="1"><output class="readout" data-for="render-cell"></output></label>
    <label class="control"><span class="control-label">Density</span><input id="render-density" type="range" min="0.1" max="1" value="0.94" step="0.01"><output class="readout" data-for="render-density"></output></label>
    <label class="control"><span class="control-label">Threshold</span><input id="render-threshold" type="range" min="0" max="0.5" value="0.11" step="0.01"><output class="readout" data-for="render-threshold"></output></label>
    <label class="control"><span class="control-label">Contrast</span><input id="render-contrast" type="range" min="0.5" max="4" value="1.85" step="0.05"><output class="readout" data-for="render-contrast"></output></label>
    <label class="control"><span class="control-label">Object dither</span><input id="render-object-dither" type="color" value="#1c81bd"><output class="readout" data-for="render-object-dither"></output></label>
    <label class="control"><span class="control-label">BG dither</span><input id="render-background" type="color" value="#15506e"><output class="readout" data-for="render-background"></output></label>
    <label class="control"><span class="control-label">BG density</span><input id="render-background-density" type="range" min="0" max="0.8" value="0.42" step="0.01"><output class="readout" data-for="render-background-density"></output></label>
    <label class="control"><span class="control-label">Outline px</span><input id="render-outline-weight" type="range" min="0.5" max="3" value="1" step="0.1"><output class="readout" data-for="render-outline-weight"></output></label>
    <label class="control"><span class="control-label">Outline fill</span><input id="render-outline-fill" type="color" value="#010101"><output class="readout" data-for="render-outline-fill"></output></label>
    <label class="control"><span class="control-label">Outline stroke</span><input id="render-outline-stroke" type="color" value="#1c81bd"><output class="readout" data-for="render-outline-stroke"></output></label>
    <label class="control"><span class="control-label">Spin</span><input id="render-spin" type="range" min="0" max="0.5" value="0.08" step="0.01"><output class="readout" data-for="render-spin"></output></label>
    <label class="shader-toggle render-toggle"><input id="render-white-matte" type="checkbox" checked><span>White matte override</span></label>
    <label class="control render-model-control"><span class="control-label">Model</span><input id="render-model-upload" type="file" accept=".glb,model/gltf-binary" disabled><output class="readout" data-for="render-model-upload">HELIX</output></label>
    <button type="button" id="render-model-reset" class="render-restart render-model-reset">Reset default helix</button>
    <label class="shader-toggle render-toggle"><input id="render-play" type="checkbox" checked><span>Auto propagate</span></label>
    <label class="shader-toggle render-toggle"><input id="render-loop" type="checkbox" checked><span>Loop sequence</span></label>
    <button type="button" id="render-restart" class="render-restart">Restart propagation</button>
  </section>
</main>
<script type="module" src="/src/studies/dither-render.js"></script>
