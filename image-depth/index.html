<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Depth — Volumetric Studies</title>
<main class="study-page">
  <canvas class="webgl" aria-label="A source image converted into an interactive 2.5D point cloud"></canvas>
  <nav class="study-nav" aria-label="Study navigation">
    <a href="/mesh-scan/">← 08</a><a href="/">Study 01 / 08</a><a class="next" href="/depth-travel/">02 →</a>
  </nav>
  <div class="study-status eyebrow">IMAGE DEPTH / SCROLL → SLICE</div>
  <section class="controls" aria-label="Study controls">
    <label class="control control-select"><span class="control-label">Dataset</span><select id="asset-set"><option value="device">Device</option><option value="subway">Subway</option><option value="soldier">Soldier</option></select><output class="readout" data-for="asset-set">A</output></label>
    <label class="control"><span class="control-label">Slice</span><input id="slice" type="range" min="-0.5" max="5" value="2.1" step="0.01"><output class="readout" data-for="slice"></output></label>
    <label class="control"><span class="control-label">Thickness</span><input id="width" type="range" min="0.06" max="1" value="1" step="0.01"><output class="readout" data-for="width"></output></label>
    <label class="control"><span class="control-label">Depth</span><input id="depth" type="range" min="0.5" max="6.5" value="6.5" step="0.01"><output class="readout" data-for="depth"></output></label>
  </section>
</main>
<script type="module" src="/src/studies/image-depth.js"></script>
