<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment Slice — Volumetric Studies</title>
<main class="study-page">
  <canvas class="webgl" aria-label="Interactive point-cloud room with a movable depth slice"></canvas>
  <nav class="study-nav" aria-label="Study navigation">
    <a href="/">← Index</a><span class="study-id">Study 01A / 04</span><a class="next" href="/image-depth/">01B →</a>
  </nav>
  <div class="study-status eyebrow">LIVE SPATIAL SECTION / Z-AXIS</div>
  <section class="study-copy">
    <p class="study-kicker">Environment / Slice</p>
    <h1>Space becomes<br>legible in layers.</h1>
    <p>A scanning plane resolves one spatial band while the rest of the environment remains provisional.</p>
  </section>
  <section class="controls" aria-label="Study controls">
    <label class="control"><span class="control-label">Slice</span><input id="slice" type="range" min="-5" max="3" value="0.1" step="0.01"><output class="readout" data-for="slice"></output></label>
    <label class="control"><span class="control-label">Width</span><input id="width" type="range" min="0.08" max="1.8" value="0.9" step="0.01"><output class="readout" data-for="width"></output></label>
    <label class="control"><span class="control-label">Density</span><input id="density" type="range" min="0.15" max="1" value="0.78" step="0.01"><output class="readout" data-for="density"></output></label>
  </section>
</main>
<script type="module" src="/src/studies/environment-slice.js"></script>
