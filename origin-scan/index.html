<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origin Scan — Volumetric Studies</title>
<main class="study-page origin-scan-page is-gui-hidden">
  <canvas class="webgl" aria-label="A scan descends through an object, then propagates radially across its ground plane"></canvas>
  <nav class="study-nav" aria-label="Study navigation">
    <a href="/scan-volume/">← 04</a><a href="/">Study 05 / 08</a><a class="next" href="/gaussian-scan/">06 →</a>
  </nav>
  <div class="study-status eyebrow">ORIGIN SCAN / OBJECT → GROUND PLANE</div>
  <div class="origin-instruction"><span>Click scene</span> to set scan origin</div>
  <div class="origin-marker" aria-hidden="true"></div>
  <div class="phase-readout" aria-live="polite"><span id="phase-index">01</span><span id="phase-name">Object descent</span></div>
  <button id="gui-toggle" class="gui-toggle origin-gui" type="button" aria-expanded="false">Show GUI</button>
  <button id="play-toggle" class="gui-toggle origin-play" type="button" aria-pressed="false">Pause loop</button>
  <section class="controls" aria-label="Study controls">
    <label class="control control-select"><span class="control-label">Dataset</span><select id="asset-set"><option value="airport">Airport</option><option value="subway">Subway</option></select><output class="readout" data-for="asset-set">AIR</output></label>
    <label class="control"><span class="control-label">Timeline</span><input id="timeline" type="range" min="0" max="1" value="0" step="0.001"><output class="readout" data-for="timeline"></output></label>
    <label class="control"><span class="control-label">Speed</span><input id="speed" type="range" min="0.08" max="0.5" value="0.19" step="0.01"><output class="readout" data-for="speed"></output></label>
    <label class="control"><span class="control-label">Object size</span><input id="object-radius" type="range" min="0.06" max="0.34" value="0.14" step="0.01"><output class="readout" data-for="object-radius"></output></label>
    <label class="control"><span class="control-label">Ground level</span><input id="ground-level" type="range" min="0.3" max="0.98" value="0.85" step="0.005"><output class="readout" data-for="ground-level"></output></label>
    <label class="control"><span class="control-label">Depth gate</span><input id="depth-gate" type="range" min="0.03" max="0.32" value="0.13" step="0.01"><output class="readout" data-for="depth-gate"></output></label>
    <label class="control"><span class="control-label">Thickness</span><input id="thickness" type="range" min="0.004" max="0.05" value="0.018" step="0.001"><output class="readout" data-for="thickness"></output></label>
    <label class="control"><span class="control-label">Spread</span><input id="spread" type="range" min="0.12" max="0.8" value="0.62" step="0.01"><output class="readout" data-for="spread"></output></label>
    <label class="control"><span class="control-label">Scene reveal</span><input id="reveal" type="range" min="0.15" max="1" value="1" step="0.01"><output class="readout" data-for="reveal"></output></label>
    <label class="control"><span class="control-label">Point</span><input id="point" type="range" min="0.65" max="5.5" value="1.65" step="0.05"><output class="readout" data-for="point"></output></label>
  </section>
</main>
<script type="module" src="/src/studies/origin-scan.js"></script>
