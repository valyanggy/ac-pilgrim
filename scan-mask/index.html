<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Mask — Volumetric Studies</title>
<main class="study-page scan-mask-page">
  <canvas class="webgl" aria-label="Depth map revealing a CT scan layer through a controllable white thickness slice"></canvas>
  <nav class="study-nav" aria-label="Study navigation">
    <a href="/depth-travel/">← 02</a><a href="/">Study 03 / 08</a><a class="next" href="/scan-mask-03-1/">03-1 →</a>
  </nav>
  <div class="study-status eyebrow">SCAN MASK / DEPTH THICKNESS</div>
  <section class="controls" aria-label="Study controls">
    <label class="control control-select"><span class="control-label">Dataset</span><select id="asset-set"><option value="subway">Subway</option><option value="mil">Military</option><option value="airport">Airport</option></select><output class="readout" data-for="asset-set">A</output></label>
    <label class="control"><span class="control-label">Slice</span><input id="slice" type="range" min="0" max="1" value="0.78" step="0.001"><output class="readout" data-for="slice"></output></label>
    <label class="control"><span class="control-label">Thickness</span><input id="thickness" type="range" min="0.015" max="0.42" value="0.12" step="0.001"><output class="readout" data-for="thickness"></output></label>
    <label class="control"><span class="control-label">Feather</span><input id="feather" type="range" min="0.001" max="0.16" value="0.045" step="0.001"><output class="readout" data-for="feather"></output></label>
    <label class="control"><span class="control-label">Depth</span><input id="depth" type="range" min="0" max="0.09" value="0.035" step="0.001"><output class="readout" data-for="depth"></output></label>
    <label class="control"><span class="control-label">CT</span><input id="ct" type="range" min="0" max="1" value="0.96" step="0.01"><output class="readout" data-for="ct"></output></label>
  </section>
</main>
<script type="module" src="/src/studies/scan-mask.js"></script>
