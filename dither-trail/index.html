<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Trail — Volumetric Studies</title>
<main class="study-page dither-trail-page">
  <section class="trail-specimen" aria-label="Two-dimensional graphic specimen beneath the dither overlay">
    <div class="trail-coordinate trail-coordinate-a">X 120.472<br>Y 038.149</div>
    <div class="trail-coordinate trail-coordinate-b">FIELD 09<br>LIVE INPUT</div>
    <div class="trail-orbit" aria-hidden="true"><span></span></div>
    <div class="trail-title">
      <span>MOVE</span>
      <span>THROUGH</span>
      <span>THE FIELD</span>
    </div>
    <div class="trail-index" aria-hidden="true">
      <span>01</span><span>02</span><span>03</span><span>04</span><span>05</span>
    </div>
    <p class="trail-note">Velocity becomes density.<br>Hierarchy becomes scale.</p>
  </section>

  <canvas class="dither-overlay" aria-label="Pointer-driven glyph dither trail"></canvas>

  <nav class="study-nav trail-ui" aria-label="Study navigation">
    <a href="/mesh-scan-organized/">← 08-1</a><a href="/">Study 09 / Dither Trail</a><a class="next" href="/">Index ↗</a>
  </nav>
  <div class="study-status eyebrow trail-ui">QUADTREE GLYPH DITHER / MOVE FAST</div>

  <section class="controls trail-controls trail-ui" aria-label="Dither trail controls">
    <label class="control"><span class="control-label">Trail</span><input id="trail-life" type="range" min="0.35" max="2.4" value="1.25" step="0.05"><output class="readout" data-for="trail-life"></output></label>
    <label class="control"><span class="control-label">Spread</span><input id="trail-spread" type="range" min="0.45" max="1.8" value="1" step="0.05"><output class="readout" data-for="trail-spread"></output></label>
    <label class="control"><span class="control-label">Density</span><input id="trail-density" type="range" min="0.4" max="1.8" value="1" step="0.05"><output class="readout" data-for="trail-density"></output></label>
  </section>

  <div class="trail-speed trail-ui">
    <span>VELOCITY</span><output id="trail-speed">000</output>
    <span>PRESSURE</span><output id="trail-pressure">00</output>
  </div>
</main>
<script type="module" src="/src/studies/dither-trail.js"></script>
