<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Volume — Volumetric Studies</title>
<main class="study-page scan-volume-page is-gui-hidden">
  <canvas class="webgl" aria-label="A CT scan image revealed on a depth-displaced 3D point cloud"></canvas>
  <nav class="study-nav" aria-label="Study navigation">
    <a href="/scan-mask-03-1/">← 03-1</a><a href="/">Study 04 / 08</a><a class="next" href="/origin-scan/">05 →</a>
  </nav>
  <div class="study-status eyebrow">SCAN VOLUME / TRUE DEPTH FIELD</div>
  <button id="gui-toggle" class="gui-toggle" type="button" aria-expanded="false">Show GUI</button>
  <section id="scan-controls" class="controls" aria-label="Study controls">
    <label class="control control-select"><span class="control-label">Dataset</span><select id="asset-set"><option value="subway">Subway</option><option value="mil">Military</option><option value="airport">Airport</option></select><output class="readout" data-for="asset-set">A</output></label>
    <label class="control"><span class="control-label">Slice</span><input id="slice" type="range" min="-0.5" max="6.5" value="4.7" step="0.01"><output class="readout" data-for="slice"></output></label>
    <label class="control"><span class="control-label">Thickness</span><input id="width" type="range" min="0.08" max="2.8" value="1.05" step="0.01"><output class="readout" data-for="width"></output></label>
    <label class="control"><span class="control-label">Depth</span><input id="depth" type="range" min="1" max="8" value="6.3" step="0.01"><output class="readout" data-for="depth"></output></label>
    <label class="control"><span class="control-label">Point</span><input id="point" type="range" min="0.45" max="3.2" value="1.05" step="0.01"><output class="readout" data-for="point"></output></label>
    <label class="control"><span class="control-label">CT</span><input id="ct" type="range" min="0" max="1" value="0.94" step="0.01"><output class="readout" data-for="ct"></output></label>
  </section>
</main>
<script type="module" src="/src/studies/scan-volume.js"></script>
