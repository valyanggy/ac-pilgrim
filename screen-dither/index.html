<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Dither — Volumetric Studies</title>
<main class="study-page">
  <canvas class="webgl" aria-label="An interactive depth map rendered with ordered Bayer dithering"></canvas>
  <nav class="study-nav" aria-label="Study navigation">
    <a href="/glyph-dither/">← 01C</a><a href="/">Study 01D / 04</a><a class="next" href="/human-volume/">02 →</a>
  </nav>
  <div class="study-status eyebrow">BAYER DITHER / SCROLL → SLICE</div>
  <label class="image-drop" id="image-drop">
    <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp">
    <span>DROP / SELECT IMAGE</span>
    <span class="image-drop-type">PNG · JPG · WEBP</span>
  </label>
  <section class="controls" aria-label="Study controls">
    <label class="control"><span class="control-label">Slice</span><input id="slice" type="range" min="-0.5" max="6" value="2.1" step="0.01"><output class="readout" data-for="slice"></output></label>
    <label class="control"><span class="control-label">Thickness</span><input id="width" type="range" min="0.06" max="1.5" value="1" step="0.01"><output class="readout" data-for="width"></output></label>
    <label class="control"><span class="control-label">Cell</span><input id="cell" type="range" min="2" max="10" value="4.5" step="0.1"><output class="readout" data-for="cell"></output></label>
  </section>
</main>
<script type="module" src="/src/studies/screen-dither.js"></script>
